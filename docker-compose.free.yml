services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: filenorm
      POSTGRES_USER: filenorm
      POSTGRES_PASSWORD: filenorm
    volumes:
      - filenorm_free_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filenorm -d filenorm"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "18026:8025"

  # Volumes criados por versões que rodavam como root: ajusta o dono para o usuário da API (uid 10001).
  uploads-permissions:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    user: "0"
    entrypoint: ["chown", "-R", "10001", "/data/uploads"]
    volumes:
      - filenorm_free_uploads:/data/uploads
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prebuilt
    environment:
      FILENORM_DB_URL: jdbc:postgresql://postgres:5432/filenorm
      FILENORM_DB_USER: filenorm
      FILENORM_DB_PASSWORD: filenorm
      FILENORM_CORS_ORIGINS: http://localhost:9081
      FILENORM_APP_BASE_URL: http://localhost:9081
      FILENORM_API_BASE_URL: http://localhost:9081
      FILENORM_EXPOSE_MAGIC_LINK: "true"
      # Sem este código o link de login não aparece na tela (a demo fica num túnel público).
      # Vazio = o link nunca aparece; ./scripts/free-demo.sh gera e imprime o código.
      FILENORM_DEMO_ACCESS_CODE: ${FILENORM_DEMO_ACCESS_CODE:-}
      FILENORM_TRUST_FORWARDED_HOST: "true"
      FILENORM_SMTP_HOST: mailpit
      FILENORM_SMTP_PORT: "1025"
      FILENORM_SMTP_AUTH: "false"
      FILENORM_SMTP_STARTTLS: "false"
      FILENORM_FROM_EMAIL: noreply@filenorm.local
      FILENORM_STORAGE_PATH: /data/uploads
    volumes:
      - filenorm_free_uploads:/data/uploads
    depends_on:
      uploads-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: same-origin
    depends_on:
      - api

  caddy:
    image: caddy:2.9-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    ports:
      - "9081:80"
    volumes:
      - ./deploy/Caddyfile.free:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

  tunnel:
    image: cloudflare/cloudflared:latest@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  filenorm_free_pg:
  filenorm_free_uploads:
