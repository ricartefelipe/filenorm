name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_DB: filenorm
          POSTGRES_USER: filenorm
          POSTGRES_PASSWORD: filenorm
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U filenorm -d filenorm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes (unitários + integração com Postgres)
        working-directory: apps/api
        env:
          FILENORM_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5433/filenorm
        run: mvn -B test
      - name: Empacotar
        working-directory: apps/api
        run: mvn -B -DskipTests package

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci --ignore-scripts
      - working-directory: apps/web
        run: npx --no-install tsc --noEmit
      - working-directory: apps/web
        run: npm run build
      - name: Auditoria de dependências de produção
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Empacotar API
        working-directory: apps/api
        run: mvn -B -DskipTests package
      - name: Jornada integrada + backup/restore (Compose)
        run: ./scripts/smoke-e2e.sh
      - name: Scan das imagens (HIGH/CRITICAL bloqueia; exceções em .trivyignore.yaml)
        run: |
          docker build -t filenorm-web:e2e apps/web
          for image in filenorm-api:e2e filenorm-web:e2e; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" \
              aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --scanners vuln --severity HIGH,CRITICAL \
              --ignorefile /trivyignore.yaml --exit-code 1 "$image"
          done
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -p filenorm-e2e -f docker-compose.e2e.yml logs --no-color api | tail -200
