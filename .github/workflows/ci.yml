name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: filenorm
          POSTGRES_USER: filenorm
          POSTGRES_PASSWORD: filenorm
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U filenorm -d filenorm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes (unitários + integração com Postgres)
        working-directory: apps/api
        env:
          FILENORM_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5433/filenorm
        run: mvn -B test
      - name: Empacotar
        working-directory: apps/api
        run: mvn -B -DskipTests package

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npx tsc --noEmit
      - working-directory: apps/web
        run: npm run build
      - name: Auditoria de dependências de produção
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
